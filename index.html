<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emirhan | Portfolio</title>
    <meta name="description" content="Personal portfolio and projects showcase." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  </head>
  <body>
    <div class="background-effects">
      <div class="glow-orb orb-1"></div>
      <div class="glow-orb orb-2"></div>
    </div>

    <header class="header">
      <div class="container header-content">
        <h1 class="logo">Emirhan<span> İnan</span></h1>
        <nav>
          <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Theme">
            <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </button>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="hero">
        <h2 class="hero-title">Crafting <span class="highlight">Digital</span> Experiences</h2>
        <p class="hero-subtitle">Building robust and scalable solutions. Showcasing my private workspace projects powered by static build architecture.</p>
      </section>

      <section class="projects-section">
        <div class="tabs-container">
          <button class="tab-btn active" data-target="projects-grid">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
            Code Projects
          </button>
          <button class="tab-btn" data-target="designs-grid">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="2"></circle><path d="M12 2a10 10 0 0 1 10 10"></path></svg>
            UI Designs
          </button>
          <button class="tab-btn" data-target="models-grid">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
            3D Models
          </button>
        </div>
        
        <!-- Code Projects Grid -->
        <div id="projects-grid" class="projects-grid tab-content active">
          <!-- Projects will be dynamically injected here -->
          <div class="loading-state">Loading projects...</div>
        </div>

        <!-- UI Designs Grid -->
        <div id="designs-grid" class="designs-grid tab-content">
          <!-- Designs will be dynamically injected here -->
          <div class="loading-state">Loading designs...</div>
        </div>

        <!-- 3D Models Grid -->
        <div id="models-grid" class="models-grid tab-content">
          <!-- Models will be dynamically injected here -->
          <div class="loading-state">Loading models...</div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container">
        <p>&copy; 2026 Emirhan. Built with ❤️ and Vite.</p>
      </div>
    </footer>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox">
      <button id="lightbox-close" class="lightbox-close">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
      <div class="lightbox-content">
        <img id="lightbox-img" src="" alt="Fullscreen Design" />
      </div>
    </div>

    <!-- 3D Viewer Modal -->
    <div id="lightbox-3d" class="lightbox">
      <button id="lightbox-3d-close" class="lightbox-close">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
      <div class="lightbox-content" style="width: 100vw; height: 100vh;">
        <model-viewer id="model-viewer-element" src="" camera-controls auto-rotate shadow-intensity="1" alt="3D Model Viewer" style="width: 100%; height: 100%; --poster-color: transparent;"></model-viewer>
      </div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
